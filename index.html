<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Retail Analytics Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      stlite.mount({
        requirements: ["pandas", "plotly"],
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st
import pandas as pd
import plotly.express as px

st.set_page_config(page_title="Retail Analytics Lab", page_icon="📊", layout="wide")

st.title("📊 Retail Analytics Lab")
st.subtitle="Psicología del Consumidor & Benchmarks Sectoriales"
st.write("Analizador de rentabilidad y comportamiento de tráfico en retail.")

# Baremos de datos
data = {
    "Sector": ["Textil", "Gran Consumo", "Salud & Belleza", "Tecnología", "Hogar & Brico", "Lujo & Joyas", "Deportes"],
    "Conversión (%)": [22.0, 88.0, 35.0, 14.0, 48.0, 4.5, 26.0],
    "UPT": [1.85, 4.50, 2.40, 1.30, 2.10, 1.10, 2.10],
    "AOV (€)": [38.0, 19.5, 24.0, 145.0, 65.0, 450.0, 42.0],
    "Tráfico (visitas/h)": [15.0, 25.0, 18.0, 8.0, 12.0, 4.0, 16.0]
}

df = pd.DataFrame(data)

# Crear el gráfico de burbujas interactivo
fig = px.scatter(
    df,
    x="Tráfico (visitas/h)",
    y="AOV (€)",
    size="Conversión (%)",
    color="Sector",
    hover_name="Sector",
    size_max=50,
    text="Sector",
    title="Mapa Psicológico del Retail: Tráfico vs. Ticket Medio (AOV)"
)

fig.update_traces(textposition='top center')
fig.update_layout(
    height=600,
    xaxis_title="Tráfico (Visitas por hora)",
    yaxis_title="Ticket Medio - AOV (€)",
    template="plotly_white"
)

# Renderizar en Streamlit
st.plotly_chart(fig, use_container_width=True)

st.subheader("📋 Datos del Benchmark")
st.dataframe(df, use_container_width=True)
`
        }
      }, document.getElementById("root"))
    </script>
  </body>
</html>
