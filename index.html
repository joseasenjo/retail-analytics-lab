<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Retail Analytics Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      stlite.mount({
        requirements: ["pandas", "plotly", "openpyxl"],
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st
import pandas as pd
import plotly.express as px
import plotly.graph_objects as go
import hashlib
from datetime import datetime

st.set_page_config(page_title="Retail Analytics Lab", page_icon="📊", layout="wide")

# --- BAREMOS BASE POR DEFECTO ---
INITIAL_DATA = {
    "Sector": ["Textil", "Gran Consumo", "Salud & Belleza", "Tecnología", "Hogar & Brico", "Lujo & Joyas", "Deportes"],
    "Conversión (%)": [22.0, 88.0, 35.0, 14.0, 48.0, 4.5, 26.0],
    "UPT": [1.85, 4.50, 2.40, 1.30, 2.10, 1.10, 2.10],
    "AOV (€)": [38.0, 19.5, 24.0, 145.0, 65.0, 450.0, 42.0],
    "Tráfico (visitas/h)": [15.0, 25.0, 18.0, 8.0, 12.0, 4.0, 16.0]
}

def calculate_hash(dataframe):
    data_bytes = dataframe.to_csv(index=False).encode('utf-8')
    return hashlib.sha256(data_bytes).hexdigest()

# --- INICIALIZACIÓN DE ESTADO (SESSION STATE) ---
if "base_df" not in st.session_state:
    st.session_state.base_df = pd.DataFrame(INITIAL_DATA)

if "audit_log" not in st.session_state:
    st.session_state.audit_log = []

# --- BARRA LATERAL ---
st.sidebar.header("🌍 Segmentación Internacional")
mercados = {
    "España (Base 1.0x)": {"aov": 1.0, "trafico": 1.0, "conv": 1.0},
    "EE.UU. (AOV +35%, Tráfico +20%)": {"aov": 1.35, "trafico": 1.20, "conv": 0.95},
    "LatAm (AOV -25%, Conversión +10%)": {"aov": 0.75, "trafico": 1.10, "conv": 1.10},
    "Centroeuropa (AOV +20%, Tráfico -10%)": {"aov": 1.20, "trafico": 0.90, "conv": 1.05}
}

selected_market = st.sidebar.selectbox("Selecciona Mercado Geográfico:", list(mercados.keys()))
mults = mercados[selected_market]

st.sidebar.write("---")
st.sidebar.header("⚙️ Restablecer Sistema")
if st.sidebar.button("🔄 Restaurar Baremos COP Lab v4"):
    st.session_state.base_df = pd.DataFrame(INITIAL_DATA)
    st.session_state.audit_log = []
    st.sidebar.success("¡Valores restaurados por defecto!")
    st.rerun()

# --- DATOS ACTIVOS ---
df_active = st.session_state.base_df.copy()
df_active["AOV (€)"] = (df_active["AOV (€)"] * mults["aov"]).round(2)
df_active["Tráfico (visitas/h)"] = (df_active["Tráfico (visitas/h)"] * mults["trafico"]).round(1)
df_active["Conversión (%)"] = (df_active["Conversión (%)"] * mults["conv"]).clip(upper=100.0).round(2)

current_hash = calculate_hash(df_active)

# --- ENCABEZADO PRINCIPAL ---
st.title("📊 Retail Analytics Lab & Benchmark Simulator")
st.caption(f"Mercado Activo: **{selected_market}** | Hash de Configuración: <code>{current_hash[:16]}...</code>", unsafe_allow_html=True)

# --- PESTAÑAS PRINCIPALES ---
tab1, tab2, tab3, tab4 = st.tabs([
    "🗺️ Mapa Psicológico", 
    "🧮 Simulador & Embudo", 
    "✏️ Editor & Carga Excel", 
    "🛡️ Auditoría & Gobernanza"
])

# --- TAB 1: MAPA PSICOLÓGICO ---
with tab1:
    st.subheader("Tráfico vs. Ticket Medio (AOV)")
    st.write("El tamaño de cada burbuja representa la **Tasa de Conversión (%)** del sector.")
    
    fig = px.scatter(
        df_active,
        x="Tráfico (visitas/h)",
        y="AOV (€)",
        size="Conversión (%)",
        color="Sector",
        hover_name="Sector",
        size_max=50,
        text="Sector",
        template="plotly_white"
    )
    fig.update_traces(textposition='top center')
    fig.update_layout(height=500, xaxis_title="Tráfico (Visitas por hora)", yaxis_title="Ticket Medio - AOV (€)")
    st.plotly_chart(fig, use_container_width=True)

    # Conceptos Teóricos Colapsables
    with st.expander("📚 Conceptos Clave: La Psicología del Tráfico y la Intención de Compra"):
        st.markdown("""
        **Relación Inversa entre Tráfico y Ticket Medio:**
        * **Sectores de Alta Fricción / Alta Meditación (Lujo / Tecnología):** El tráfico es bajo porque el consumidor requiere múltiples visitas e investigación antes de decidir. La conversión es baja, pero se compensa con un **AOV (Ticket Medio)** muy elevado.
        * **Sectores de Necesidad / Fricción Cero (Gran Consumo / Supermercados):** El tráfico y la conversión son masivos (hasta el 88%) porque la intención de compra es directa. La rentabilidad se logra por volumen de cestas y unidades por ticket (**UPT**), no por un AOV alto.
        """)

# --- TAB 2: SIMULADOR & EMBUDO ---
with tab2:
    st.subheader("Simulador de Escenarios Financieros")
    
    col_ctrl, col_res = st.columns([1, 1.2])
    
    with col_ctrl:
        sector_sel = st.selectbox("Selecciona Sector:", df_active["Sector"].unique())
        s_data = df_active[df_active["Sector"] == sector_sel].iloc[0]
        
        st.write("---")
        st.markdown("**Palancas Operativas:**")
        t_input = st.slider("Tráfico (visitas/h)", 1.0, 80.0, float(s_data["Tráfico (visitas/h)"]))
        c_input = st.slider("Conversión (%)", 0.5, 100.0, float(s_data["Conversión (%)"]))
        a_input = st.slider("Ticket Medio AOV (€)", 5.0, 1000.0, float(s_data["AOV (€)"]))
        u_input = st.slider("Unidades por Ticket (UPT)", 1.0, 10.0, float(s_data["UPT"]))

    with col_res:
        horas = 8
        visitas_tot = t_input * horas
        compradores_tot = visitas_tot * (c_input / 100)
        articulos_tot = compradores_tot * u_input
        facturacion = compradores_tot * a_input
        
        st.markdown(f"#### Proyección Comercial (8 horas): **{sector_sel}**")
        
        c1, c2, c3 = st.columns(3)
        c1.metric("Visitas Totales", f"{int(visitas_tot)}")
        c2.metric("Compradores", f"{int(compradores_tot)}")
        c3.metric("Facturación", f"{facturacion:,.2f} €")
        
        # Embudo de Conversión
        fig_funnel = go.Figure(go.Funnel(
            y = ["Visitas Totales", "Compradores", "Artículos Vendidos"],
            x = [visitas_tot, compradores_tot, articulos_tot],
            textinfo = "value+percent initial",
            marker = {"color": ["#636EFA", "#EF553B", "#00CC96"]}
        ))
        fig_funnel.update_layout(height=260, margin=dict(l=10, r=10, t=10, b=10))
        st.plotly_chart(fig_funnel, use_container_width=True)

    # Generador de Insights para LinkedIn
    st.write("---")
    if st.button("📝 Generar Insight para LinkedIn"):
        clave_analitica = "El volumen de visitas compensa el margen ajustado por ticket." if t_input > 20 else "La alta exclusividad requiere maximizar el AOV y la venta cruzada (UPT)."
        insight_text = f"📊 Retail Analytics Insight ({sector_sel} - {selected_market}):\n\nEn una jornada de 8h, con un tráfico de {int(t_input)} visitas/hora y una conversión del {c_input}% (AOV: {a_input}€, UPT: {u_input}), estimamos una facturación proyectada de {facturacion:,.2f}€.\n\n💡 Clave analítica: {clave_analitica}\n\nHerramienta desarrollada por Jose Luis Asenjo."
        st.text_area("Copia y pega este texto en tu publicación de LinkedIn:", insight_text, height=160)

    # Conceptos Teóricos Colapsables
    with st.expander("📚 Conceptos Clave: La Matemática de la Rentabilidad en Retail"):
        st.markdown("""
        **Fórmula Fundamental de Venta:**
        $$\text{Facturación} = \text{Tráfico} \times \text{Conversión (\%)} \times \text{Ticket Medio (AOV)}$$
        
        * **UPT (Units Per Transaction):** Mide la eficacia de la venta cruzada. Elevar el UPT incrementa el AOV sin necesidad de aumentar el precio unitario de los productos.
        * **Funnel Efficiency:** La brecha entre el tráfico total y los compradores reales indica el nivel de fricción en la tienda o checkout.
        """)

# --- TAB 3: EDITOR & EXPORTACIÓN ---
with tab3:
    st.subheader("✏️ Editor de Baremos & Carga de Datos")
    
    col_up, col_dl = st.columns([2, 1])
    with col_up:
        file_upload = st.file_uploader("Subir archivo Excel o CSV:", type=["csv", "xlsx"])
        if file_upload is not None:
            try:
                new_df = pd.read_csv(file_upload) if file_upload.name.endswith(".csv") else pd.read_excel(file_upload)
                st.session_state.base_df = new_df
                st.success("¡Datos cargados con éxito!")
                st.rerun()
            except Exception as e:
                st.error(f"Error al leer archivo: {e}")

    with col_dl:
        st.write("**Exportar Baremos Activos:**")
        csv_bytes = df_active.to_csv(index=False).encode('utf-8')
        st.download_button(
            label="📥 Descargar Baremos (CSV)",
            data=csv_bytes,
            file_name=f"baremos_retail_{selected_market.split(' ')[0]}.csv",
            mime="text/csv"
        )

    st.write("---")
    st.write("**Edición directa en celdas:**")
    edited_df = st.data_editor(st.session_state.base_df, num_rows="dynamic", use_container_width=True)
    
    if st.button("💾 Guardar Cambios en Baremos"):
        st.session_state.base_df = edited_df
        st.success("¡Baremos base actualizados!")
        st.rerun()

    # Conceptos Teóricos Colapsables
    with st.expander("📚 Conceptos Clave: Baremos Dinámicos vs. Baremos Estáticos"):
        st.markdown("""
        **¿Por qué usar Baremos Flexibles?**
        Los promedios estáticos del sector quedan desfasados rápidamente por la inflación o cambios regionales. 
        Permitir que el analista ajuste o cargue sus propios datasets garantiza que los modelos de proyección reflejen la realidad operativa de la empresa.
        """)

# --- TAB 4: AUDITORÍA & GOBERNANZA ---
with tab4:
    st.subheader("🛡️ Motor de Auditoría & Hash SHA-256")
    
    col_h1, col_h2 = st.columns([2, 1])
    with col_h1:
        st.info(f"**Hash SHA-256 Actual:** {current_hash}", icon="🔒")
    with col_h2:
        st.success("**Gobernanza:** Integridad Verificada")

    st.write("---")
    st.markdown("#### Registro de Auditoría de Cambios")
    
    with st.form("audit_form"):
        fuente_input = st.text_input("Fuente declarada de los datos:")
        motivo_input = st.text_area("Motivo o justificación de la modificación:")
        submitted = st.form_submit_button("Registrar Evento de Auditoría")
        
        if submitted and fuente_input:
            timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
            entry = {
                "Fecha": timestamp,
                "Mercado": selected_market,
                "Hash": current_hash[:16] + "...",
                "Fuente": fuente_input,
                "Motivo": motivo_input
            }
            st.session_state.audit_log.append(entry)
            st.success("Evento guardado en el log de auditoría.")

    if st.session_state.audit_log:
        audit_df = pd.DataFrame(st.session_state.audit_log)
        st.write("#### 📜 Log de Eventos:")
        st.dataframe(audit_df, use_container_width=True)
        
        audit_csv = audit_df.to_csv(index=False).encode('utf-8')
        st.download_button(
            label="📥 Descargar Log de Auditoría (CSV)",
            data=audit_csv,
            file_name="log_auditoria_retail.csv",
            mime="text/csv"
        )

    # Conceptos Teóricos Colapsables
    with st.expander("📚 Conceptos Clave: Trazabilidad y Criptografía en Analítica"):
        st.markdown("""
        **Seguridad y Transparencia:**
        Un **Hash SHA-256** es una huella digital única generada a partir del conjunto de datos activos. 
        Si se modifica un solo número o coma del benchmark, la firma cambia por completo. Esto impide la alteración silenciosa de datos y garantiza que los informes ejecutivos sean auditables.
        """)

# --- PIE DE PÁGINA (FOOTER) ---
st.markdown("---")
st.markdown(
    "<div style='text-align: center; color: #555; padding: 20px; font-size: 14px; font-weight: 500;'>"
    "Desarrollado por <b>Jose Luis Asenjo</b> | Retail Analytics Lab"
    "</div>", 
    unsafe_allow_html=True
)
`
        }
      }, document.getElementById("root"))
    </script>
  </body>
</html>
